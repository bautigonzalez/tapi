version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*', '@smithy/*', '@aws-crypto/*']
      cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', 'constructs', 'cdk-nag']
      tooling:
        patterns: ['typescript', 'vitest', 'esbuild', 'tsx', '@types/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
